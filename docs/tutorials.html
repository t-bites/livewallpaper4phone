  .tutorial-page { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
  .tutorial-page h2 { font-size: 22px; margin: 30px 0 10px; color: var(--accent); }
  .tutorial-page h3 { font-size: 17px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .tutorial-page h3 .brand-icon { font-size: 22px; }

  .tutorial-page .back-link:hover { color: var(--accent); }
  .tutorial-page .warning { background: #2a1a1a; border-left: 3px solid #e74c3c; padding: 12px 16px; border-radius: 8px; margin: 12px 0; font-size: 13px; color: #e88; }
  hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
