<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Live Wallpaper 4 Phone — 手机动态壁纸</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <h1>📱 <span>Live</span>Wallpaper4Phone</h1>
  <nav>
    <a href="index.html" class="active">壁纸</a>
    <a href="tutorials.html">设置教程</a>
    <a href="#" id="nav-submit">提交壁纸</a>
  </nav>
  <span class="stats" id="stats"></span>
</header>

<div class="filters" id="filters">
  <label>比例</label>
  <select id="filter-ar"><option value="">全部</option></select>
  <label>清晰度</label>
  <select id="filter-quality"><option value="">全部</option></select>
  <label>风格</label>
  <select id="filter-style"><option value="">全部</option></select>
  <label>来源</label>
  <select id="filter-source"><option value="">全部</option></select>
  <input type="text" id="search" placeholder="🔍 搜索标题/标签/提示词...">
  <button class="clear-btn" id="clear-all">清除</button>
  <span class="count" id="result-count"></span>
</div>

<div class="wallpaper-grid" id="grid"></div>
<div class="loading" id="loading"><div class="spinner"></div>加载壁纸中...</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-video" id="modal-video"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- 上报弹窗 -->
<div class="modal-overlay" id="submit-modal" style="display:none" onclick="closeSubmit(event)">
  <div class="modal submit-modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeSubmit()">✕</button>
    <div class="modal-body submit-body">
      <h2 id="submit-title"></h2>
      <div id="pw-row">
        <label class="form-label" id="label-pw"></label>
        <input type="password" id="submit-pw" autocomplete="off">
      </div>
      <label class="form-label" id="label-url"></label>
      <input type="url" id="submit-url">
      <label class="form-label" id="label-note"></label>
      <textarea id="submit-note" rows="2"></textarea>
      <div class="form-error" id="submit-error"></div>
      <button class="download-btn" id="submit-go"></button>
      <div class="download-hint" id="submit-hint"></div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
